interface:
  display_name: "Manage XRCVC Profile and Settings"
  short_description: "Update your contact details and library settings"
  icon_small: "./assets/xrcvc-library-icon.png"
  icon_large: "./assets/xrcvc-library-logo.png"
  brand_color: "#E8601C"
  default_prompt: "Use $xrcvc-settings-management to update my XRCVC Library contact details or the settings allowed for my authenticated role."
dependencies:
  tools:
    - type: "mcp"
      value: "xrcvc-library"
      description: "Self-scoped and role-authorized XRCVC Library settings mutation tools"
      transport: "streamable_http"
      url: "https://mcp.library.xrcvc.org/mcp/authorize"
policy:
  allow_implicit_invocation: true
