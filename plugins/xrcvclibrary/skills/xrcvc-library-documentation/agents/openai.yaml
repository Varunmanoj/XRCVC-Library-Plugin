interface:
  display_name: "Explain XRCVC Library Documentation"
  short_description: "Explain Member and Owner's Manual guidance"
  icon_small: "./assets/xrcvc-library-icon.png"
  icon_large: "./assets/xrcvc-library-logo.png"
  brand_color: "#E8601C"
  default_prompt: "Use $xrcvc-library-documentation to explain the XRCVC Library request and order lifecycle from the public manuals."
dependencies:
  tools:
    - type: "mcp"
      value: "xrcvc-library"
      description: "Public XRCVC Library documentation Markdown"
      transport: "streamable_http"
      url: "https://mcp.library.xrcvc.org/mcp/authorize"
policy:
  allow_implicit_invocation: true
