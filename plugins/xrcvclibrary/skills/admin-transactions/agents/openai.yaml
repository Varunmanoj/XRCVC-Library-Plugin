interface:
  display_name: "Manage Admin XRCVC Transactions"
  short_description: "Review and manage authorized transactions"
  icon_small: "./assets/xrcvc-library-icon.png"
  icon_large: "./assets/xrcvc-library-logo.png"
  brand_color: "#E8601C"
  default_prompt: "Use $admin-transactions to review or manage role-authorized XRCVC Library requests, orders, and saved carts."
dependencies:
  tools:
    - type: "mcp"
      value: "xrcvc-library"
      description: "Role-authorized XRCVC Library operational transaction read and mutation tools"
      transport: "streamable_http"
      url: "https://mcp.library.xrcvc.org/mcp/authorize"
policy:
  allow_implicit_invocation: true
