interface:
  display_name: "XRCVC Membership Directory"
  short_description: "Look up Membership IDs or administer accounts"
  icon_small: "./assets/xrcvc-library-icon.png"
  icon_large: "./assets/xrcvc-library-logo.png"
  brand_color: "#E8601C"
  default_prompt: "Use $admin-member-directory to look up authenticated Membership ID profiles or administer role-authorized XRCVC Library accounts."
dependencies:
  tools:
    - type: "mcp"
      value: "xrcvc-library"
      description: "Role-authorized XRCVC Library user and Membership ID read and mutation tools"
      transport: "streamable_http"
      url: "https://mcp.library.xrcvc.org/mcp/authorize"
policy:
  allow_implicit_invocation: true
