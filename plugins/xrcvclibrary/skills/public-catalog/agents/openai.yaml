interface:
  display_name: "Explore Public XRCVC Catalog"
  short_description: "Research public catalog items and taxonomies"
  icon_small: "./assets/xrcvc-library-icon.png"
  icon_large: "./assets/xrcvc-library-logo.png"
  brand_color: "#E8601C"
  default_prompt: "Use $public-catalog to find and compare accessible resources in the public XRCVC Library catalog."
dependencies:
  tools:
    - type: "mcp"
      value: "xrcvc-library"
      description: "Public XRCVC Library catalog and taxonomy data"
      transport: "streamable_http"
      url: "https://mcp.library.xrcvc.org/mcp/authorize"
policy:
  allow_implicit_invocation: true
