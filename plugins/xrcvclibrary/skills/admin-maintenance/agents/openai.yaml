interface:
  display_name: "Run XRCVC Maintenance"
  short_description: "Review and run protected maintenance operations"
  icon_small: "./assets/xrcvc-library-icon.png"
  icon_large: "./assets/xrcvc-library-logo.png"
  brand_color: "#E8601C"
  default_prompt: "Use $admin-maintenance to review a role-authorized XRCVC Library maintenance operation before executing it."
dependencies:
  tools:
    - type: "mcp"
      value: "xrcvc-library"
      description: "Admin and Developer XRCVC Library maintenance mutation tools"
      transport: "streamable_http"
      url: "https://mcp.library.xrcvc.org/mcp/authorize"
policy:
  allow_implicit_invocation: true
