interface:
  display_name: "Introduce XRCVC Library"
  short_description: "Explain XRCVC Library and its features"
  icon_small: "./assets/xrcvc-library-icon.png"
  icon_large: "./assets/xrcvc-library-logo.png"
  brand_color: "#E8601C"
  default_prompt: "Use $xrcvc-library-introduction to introduce XRCVC Library and explain what I can do with it."
dependencies:
  tools:
    - type: "mcp"
      value: "xrcvc-library"
      description: "Public and role-authorized XRCVC Library information"
      transport: "streamable_http"
      url: "https://mcp.library.xrcvc.org/mcp/authorize"
policy:
  allow_implicit_invocation: true
