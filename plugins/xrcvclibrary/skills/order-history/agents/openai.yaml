interface:
  display_name: "Order History"
  short_description: "Review order and request timelines"
  icon_small: "./assets/xrcvc-library-icon.png"
  icon_large: "./assets/xrcvc-library-logo.png"
  brand_color: "#E8601C"
  default_prompt: "Use $order-history to explain an XRCVC Library order timeline and its generated request histories."
dependencies:
  tools:
    - type: "mcp"
      value: "xrcvc-library"
      description: "Authenticated XRCVC Library order and generated-request lifecycle data"
      transport: "streamable_http"
      url: "https://mcp.library.xrcvc.org/mcp/authorize"
policy:
  allow_implicit_invocation: true
