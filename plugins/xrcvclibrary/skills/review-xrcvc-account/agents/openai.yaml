interface:
  display_name: "Review XRCVC Tasks and Activity"
  short_description: "Explore tasks, recent activity, requests, and orders"
  icon_small: "./assets/xrcvc-library-icon.png"
  icon_large: "./assets/xrcvc-library-logo.png"
  brand_color: "#E8601C"
  default_prompt: "Use $review-xrcvc-account to show my role-authorized XRCVC Tasks and Recent Activity from the complete Markdown tools."
dependencies:
  tools:
    - type: "mcp"
      value: "xrcvc-library"
      description: "Role-authorized XRCVC Library account and operational data"
      transport: "streamable_http"
      url: "https://mcp.library.xrcvc.org/mcp/authorize"
policy:
  allow_implicit_invocation: true
