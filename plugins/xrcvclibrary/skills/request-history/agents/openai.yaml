interface:
  display_name: "Request History"
  short_description: "Review request lifecycle history"
  icon_small: "./assets/xrcvc-library-icon.png"
  icon_large: "./assets/xrcvc-library-logo.png"
  brand_color: "#E8601C"
  default_prompt: "Use $request-history to explain the lifecycle of an XRCVC Library request."
dependencies:
  tools:
    - type: "mcp"
      value: "xrcvc-library"
      description: "Authenticated XRCVC Library request lifecycle data"
      transport: "streamable_http"
      url: "https://mcp.library.xrcvc.org/mcp/authorize"
policy:
  allow_implicit_invocation: true
